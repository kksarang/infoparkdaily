<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Details | InfoparkDaily</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = (params.get("id") || "").trim().toLowerCase();
        if (id) {
          window.location.replace("/job/" + encodeURIComponent(id) + window.location.hash);
          return;
        }
        window.location.replace("/jobs.html");
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to job page… <a href="/jobs.html">View all jobs</a></p>
  </body>
</html>
