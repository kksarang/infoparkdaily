<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Job Details | InfoparkDaily</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicon-180.png" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = (params.get("id") || "").trim().toLowerCase();
        if (id) {
          window.location.replace("/job/" + encodeURIComponent(id) + window.location.hash);
          return;
        }
        window.location.replace("/jobs/" + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to job page… <a href="/jobs/">View all jobs</a></p>
  </body>
</html>
