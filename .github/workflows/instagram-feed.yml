name: Instagram feed

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest reels and posters
        env:
          IG_TOKEN_INFOPARKDAILY: ${{ secrets.IG_TOKEN_INFOPARKDAILY }}
          IG_TOKEN_INFOPARKDAILY_JOBS: ${{ secrets.IG_TOKEN_INFOPARKDAILY_JOBS }}
        run: python scripts/fetch-instagram-feed.py
      - name: Commit changes
        run: |
          git add data/instagram-feed.js assets/instagram
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "infoparkdaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Instagram feed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
