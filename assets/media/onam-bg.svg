<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="0.55" stop-color="#121018"/>
      <stop offset="1" stop-color="#1a140c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#ffc107" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.18" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#ffc107" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffc107" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc107"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- stylized pookalam rings (decorative only, no text) -->
  <g transform="translate(1180 420)" opacity="0.9">
    <circle r="250" stroke="#ffc107" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="210" stroke="#fb923c" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="170" stroke="#ffc107" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="130" stroke="#fde68a" stroke-opacity="0.28" stroke-width="2"/>
    <circle r="90" stroke="#ffc107" stroke-opacity="0.35" stroke-width="2.5"/>
    <circle r="42" fill="url(#petal)" fill-opacity="0.85"/>
    <g fill="#ffc107" fill-opacity="0.55">
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(0)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(45)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(90)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(135)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(180)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(225)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(270)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="36" transform="rotate(315)"/>
    </g>
  </g>

  <!-- soft lamp glow orb -->
  <circle cx="1180" cy="420" r="28" fill="#fff7cc" fill-opacity="0.9"/>
  <circle cx="1180" cy="420" r="70" fill="#ffc107" fill-opacity="0.18"/>
</svg>
